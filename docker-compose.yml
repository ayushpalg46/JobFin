version: '3.8'

services:
  # MySQL Database Service (Experiment 5)
  mysql-db:
    image: mysql:8.0
    container_name: jobfins_mysql
    restart: always
    environment:
      MYSQL_DATABASE: jobfins_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jobfins-network

  # Spring Boot REST API Service (Experiments 4, 5, 6)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobfins_backend
    restart: always
    depends_on:
      - mysql-db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/jobfins_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - jobfins-network

  # React Frontend Service (Milestones 3, 7)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobfins_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - jobfins-network

volumes:
  mysql_data:

networks:
  jobfins-network:
    driver: bridge
