# ==============================================================================
# Render Blueprint Specification for JobFins
# Automatically builds and orchestrates Backend, Frontend, and Database services
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: jobfins-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: jobfins-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. React / Vite Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: jobfins-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jobfins-backend
          property: host
          value: https://jobfins-backend.onrender.com/api

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database on Render
# ------------------------------------------------------------------------------
databases:
  - name: jobfins-postgres
    plan: free
    region: oregon
    databaseName: jobfins_db
    user: jobfins_user
