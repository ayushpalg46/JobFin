# ==============================================================================
# Render Blueprint Specification for JobFins (MySQL Production)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Spring Boot Backend Web Service (Docker - MySQL Connected)
  # ----------------------------------------------------------------------------
  - type: web
    name: jobfins-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/dashboard/stats
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. React / Vite Frontend (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: jobfins-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: jobfins-backend
          property: host
          value: https://jobfins-backend.onrender.com/api
