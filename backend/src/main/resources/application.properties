# ===================================================================
# JobFins - Application Configuration (Experiment 4, 5, 6)
# ===================================================================

# Application Name & Port (Port 8080 as required by lab manual)
spring.application.name=jobfins
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration (Experiment 5: JPA & MySQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/jobfins_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Hibernate & JPA Properties (Experiment 5)
# -------------------------------------------------------------------
# ddl-auto=update automatically creates or updates tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update
# show-sql=true prints SQL queries to the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# JWT Configuration (Experiment 6: Authentication & Security)
# -------------------------------------------------------------------
# Secret key (at least 256 bits for HMAC-SHA256)
app.jwt.secret=JobFinsSecretKeyForJwtSigningMustBeAtLeast256BitsLongForSecurityPurpose123456
# Expiration time: 86400000 milliseconds = 24 hours
app.jwt.expiration-ms=86400000
