# ===================================================================
# JobFins - Production & Render Configuration
# ===================================================================

# Application Name & Dynamic Port (Render uses $PORT)
spring.application.name=jobfins
server.port=${PORT:8080}

# -------------------------------------------------------------------
# Database Configuration (Supports MySQL & PostgreSQL via Env Vars)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobfins_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# -------------------------------------------------------------------
# Hibernate & JPA Properties
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Configuration
# -------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:JobFinsSecretKeyForJwtSigningMustBeAtLeast256BitsLongForSecurityPurpose123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

